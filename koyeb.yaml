services:
  - name: backend
    github:
      repository: hacanand/pyramid-project-management
      branch: deploy-koyeb
      workdir: pyramid-project-management-BE
    builder:
      docker:
        dockerfile: Dockerfile
    ports:
      - port: 3001
        protocol: http
    routes:
      - path: /
        port: 3001
    env:
      - NODE_ENV=production
      - PORT=3001

  - name: frontend
    github:
      repository: hacanand/pyramid-project-management
      branch: deploy-koyeb
      workdir: pyramid-project-management-FE
    builder:
      docker:
        dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    env:
      - NODE_ENV=production
