services:
  - name: pyramid-monorepo
    github:
      repository: hacanand/pyramid-project-management
      branch: deploy-koyeb
      workdir: /
    builder:
      docker:
        dockerfile: Dockerfile
    ports:
      - port: 3000
        protocol: http
      - port: 3001
        protocol: http
    routes:
      - path: /
        port: 3000
      - path: /api
        port: 3001
    env:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=/api
